name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  enhance-changelog:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Enhance CHANGELOG.md on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_NOTES_MODEL: ${{ vars.OPENAI_RELEASE_NOTES_MODEL }}
        run: |
          set -euo pipefail
          branch="$(gh pr list --state open --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName')"
          test -n "$branch"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          version="$(node -p "require('./package.json').version")"
          tag="knowcards-v${version}"
          bun run --silent generate-release-notes -- "$tag" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          bun run --silent generate-release-notes -- --update-changelog "$tag" "$RUNNER_TEMP/release-notes.md"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already matched enhanced release notes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: enhance changelog for ${tag}"
          git push origin "HEAD:$branch"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Generate enhanced release notes
        if: ${{ needs.release-please.outputs.release_created }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_NOTES_MODEL: ${{ vars.OPENAI_RELEASE_NOTES_MODEL }}
        run: |
          set -euo pipefail
          npm --silent run generate-release-notes -- "${{ needs.release-please.outputs.tag_name }}" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          release_title="$(sed -n 's/^# //p' "$RUNNER_TEMP/release-notes.md" | head -n 1)"
          release_body_file="$RUNNER_TEMP/release-notes.md"
          release_edit_args=()
          if [ -n "$release_title" ]; then
            release_body_file="$RUNNER_TEMP/release-body.md"
            tail -n +2 "$RUNNER_TEMP/release-notes.md" | sed '1{/^$/d;}' > "$release_body_file"
            release_edit_args+=(--title "$release_title")
          fi
          release_edit_args+=(--notes-file "$release_body_file")
          gh release edit "${{ needs.release-please.outputs.tag_name }}" "${release_edit_args[@]}"
          echo "Enhanced release notes were applied."

      # Trusted publishing (OIDC). Configure on npmjs.com → package → Trusted Publisher:
      #   Organization or user: manojbajaj95
      #   Package: knowcards  (GitHub repo: agent-knowledge-cards)
      #   Workflow filename: release-please.yml
      - name: Publish to npm
        run: npm publish --access public
